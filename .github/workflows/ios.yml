# Builds an UNSIGNED iOS .ipa from the static game in docs/ (Capacitor WKWebView shell) and publishes it
# as the GitHub Release "ios-latest". Unsigned = it must be re-signed on install (AltStore / Sideloadly with
# a free Apple ID, or TrollStore); a directly installable build needs a paid Apple Developer account.
name: iOS IPA

on:
  push:
    branches: [main]
    paths: ["docs/**", "app/**", "capacitor.config.json", "package.json", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor (+ Filesystem plugin for hot updates)
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: npx cap add ios

      - name: Landscape, fullscreen, app icon
        run: |
          set -e
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          for key in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            $PB -c "Delete :$key" "$PL" || true
            $PB -c "Add :$key array" "$PL"
            $PB -c "Add :$key:0 string UIInterfaceOrientationLandscapeRight" "$PL"
            $PB -c "Add :$key:1 string UIInterfaceOrientationLandscapeLeft" "$PL"
          done
          $PB -c "Delete :UIRequiresFullScreen" "$PL" || true
          $PB -c "Add :UIRequiresFullScreen bool true" "$PL"
          $PB -c "Delete :UIStatusBarHidden" "$PL" || true
          $PB -c "Add :UIStatusBarHidden bool true" "$PL"
          $PB -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PL" || true
          $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PL"
          $PB -c "Set :CFBundleDisplayName 无限梦境" "$PL" || $PB -c "Add :CFBundleDisplayName string 无限梦境" "$PL"
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp app/ios/AppIcon-1024.png "$f"; done
          ls "$ICONSET"
          plutil -p "$PL" | head -60

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          set -e
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.$(cat ../../app/native_rev.txt).${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "built $APP"
          mkdir -p Payload ../../out
          cp -R "$APP" Payload/
          zip -qry ../../out/infinite-dream.ipa Payload
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: infinite-dream-ipa
          path: out/infinite-dream.ipa

      - name: Publish release "ios-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: 无限梦境 Infinite Dream iOS 版（最新构建 · 未签名）
          body: |
            `infinite-dream.ipa` 是**未签名**的 iOS 安装包，需要用以下任一方式安装（苹果不允许未签名应用直接安装）：
            - **AltStore / SideStore**、**Sideloadly**：用自己的 Apple ID 免费重签后安装（免费 ID 每 7 天需重新签名一次）。
            - **TrollStore**（支持的 iOS 版本）：直接安装，永久有效。
            - 不想折腾：用 Safari 打开 https://designer-awei.github.io/infinite-dream-preview/ → 分享 → 「添加到主屏幕」，即可全屏游玩（存档在本机）。
            横屏全屏运行；网页版更新后 App 启动会自动从 GitHub 增量更新，无需重装。
            构建自提交 ${{ github.sha }}
          files: out/infinite-dream.ipa
          make_latest: false
