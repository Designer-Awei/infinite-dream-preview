# Builds an installable Android APK from the static game in docs/ (Capacitor WebView shell)
# and publishes it as a GitHub Release asset ("latest") plus a workflow artifact.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["docs/**", "app/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor (+ Filesystem plugin for hot updates)
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Landscape, fullscreen, app icon
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          # lock to landscape (either side), handle rotation/resize in the WebView
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MAN"
          # immersive fullscreen activity
          cp app/native/MainActivity.java android/app/src/main/java/com/designerawei/infinitedream/preview/MainActivity.java
          # launcher icons (pre-rendered from app/icon.png into app/res)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in app/res/mipmap-*; do
            name=$(basename "$d")
            mkdir -p "android/app/src/main/res/$name"
            rm -f "android/app/src/main/res/$name/ic_launcher_foreground.png"
            cp "$d"/*.png "android/app/src/main/res/$name/"
          done
          grep -n "screenOrientation" "$MAN"
          # every build gets a higher versionCode: installing a newer APK resets hot updates to its own files
          # versionName 1.<native rev>.<build>: the game reads the native rev to know when a new installer is needed
          REV=$(cat app/native_rev.txt)
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.$REV.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/infinite-dream.apk
          # Verify the APK signed by the fresh runner-generated debug key.
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $SIGNER verify --print-certs ../out/infinite-dream.apk | tee ../out/cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: infinite-dream-apk
          path: out/infinite-dream.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 无限梦境预览版 安卓版（最新构建）
          body: |
            手机下载 `infinite-dream.apk` 安装即可（需允许"安装未知来源应用"）。
            横屏全屏运行，存档保存在本机；联机与网页版互通（房间码相同）。
            以后网页版更新时，APK 启动会自动从 GitHub 增量下载变化的文件，无需重装。
            预览版使用每次构建自动生成的调试签名；不同构建或正式版之间可能需要卸载后重装（卸载会清除本机存档）。
            构建自提交 ${{ github.sha }}
          files: out/infinite-dream.apk
          make_latest: true
